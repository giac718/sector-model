name: Daily sector rotation run

on:
  schedule:
    # Monday to Friday at 22:30 UTC: 5:30pm Eastern in winter, 6:30pm in summer,
    # so always after the 4:15pm Eastern cutoff the scripts use for a completed close.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

# No permissions by default; each job below asks only for what it needs.
permissions: {}

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Write access to repository contents, only to push log/signals.csv.
    permissions:
      contents: write
    timeout-minutes: 20
    # Every step stops the job on the first failing command, so a failed
    # script means nothing is uploaded and the published site stays as it was.
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Remove previously generated results
        # The repo holds an old copy of some outputs; publish only what this run builds.
        run: rm -f output/*.csv output/*.html output/*.json

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Fetch regime data
        run: python scripts/fetch_regime.py

      - name: Build market environment signal
        run: python scripts/environment.py

      - name: Rank sectors
        run: python scripts/rank_sectors.py

      - name: Label sector status
        run: python scripts/sector_status.py

      - name: Build rank history
        run: python scripts/rank_history.py

      - name: Build dashboard
        run: python scripts/build_dashboard.py

      - name: Rank stocks in the top Leading and weakest Lagging sectors
        # The 3 Leading sectors with the highest relative score and the 2 Lagging
        # sectors with the lowest, from output/sector_status_today.json.
        run: |
          sectors=$(python scripts/build_site.py --list-sectors)
          echo "Sectors to scan: ${sectors:-none}"
          for sector in $sectors; do
            echo "::group::sector_stocks.py $sector"
            python scripts/sector_stocks.py "$sector"
            echo "::endgroup::"
          done

      - name: Build site
        run: python scripts/build_site.py

      - name: Check the pages to publish exist
        run: test -s output/index.html && test -s output/dashboard.html

      - name: Log signals
        run: python scripts/log_signals.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

      - name: Commit the signals log
        # Runs after the Pages artifact is uploaded, so nothing here can alter
        # what gets published. Only log/signals.csv is staged, so no other
        # generated file is committed.
        run: |
          git add log/signals.csv
          if git diff --cached --quiet; then
            echo "log/signals.csv is unchanged; nothing to commit."
            exit 0
          fi
          price_date=$(python -c "import json; print(json.load(open('output/sector_status_today.json'))['date'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "log: signals for $price_date"
          # Pick up anything pushed while this run was going. --autostash sets
          # the other generated files aside during the rebase.
          git pull --rebase --autostash
          if ! git push; then
            echo "Push rejected; pulling again and retrying once."
            git pull --rebase --autostash
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
